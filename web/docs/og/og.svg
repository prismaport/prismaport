<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @font-face { font-family: 'Familjen Grotesk'; font-weight: 700; src: url('../src/fonts/familjen-grotesk-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Onest'; font-weight: 400; src: url('../src/fonts/onest-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Onest'; font-weight: 600; src: url('../src/fonts/onest-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 500; src: url('../src/fonts/geist-mono-latin-500-normal.woff2') format('woff2'); }
    .display { font-family: 'Familjen Grotesk'; font-weight: 700; fill: #12141c; }
    .body { font-family: 'Onest'; font-weight: 400; fill: #4e5566; }
    .label { font-family: 'Onest'; font-weight: 600; font-size: 15px; letter-spacing: 0.9px; fill: #4e5566; }
    .code { font-family: 'Geist Mono'; font-weight: 500; font-size: 19px; fill: #12141c; }
    .verb { fill: #b0185a; }
    .muted { fill: #4e5566; }
  </style>
  <rect width="1200" height="630" fill="#f4f5f8"/>

  <g transform="translate(72 62) scale(0.875)" fill="none" stroke="#b0185a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 10 L55 50 L9 50 Z" stroke-width="4"/>
    <path d="M3 36 L43 33 L61 25" stroke-width="4"/>
    <path d="M43 33 L61 43" stroke-width="2.2"/>
  </g>
  <text class="display" x="136" y="103" font-size="38" letter-spacing="-0.4">Prismaport</text>
  <text class="body" x="352" y="103" font-size="30">Developers</text>

  <text class="display" font-size="60" letter-spacing="-1.5">
    <tspan x="72" y="250">Stablecoin payments,</tspan>
    <tspan x="72" y="318">one REST API.</tspan>
  </text>
  <text class="body" font-size="27">
    <tspan x="72" y="392">Products, payment links, sessions</tspan>
    <tspan x="72" y="430">and signed webhooks. Test and Live.</tspan>
  </text>

  <text class="code muted" x="72" y="545">docs.prismaport.com</text>

  <rect x="744" y="150" width="392" height="290" rx="18" fill="#ffffff" stroke="#d7dbe3"/>
  <text class="label" x="770" y="190">API REFERENCE</text>
  <text class="code"><tspan class="verb" x="770" y="240">POST</tspan><tspan x="836" y="240">/v1/sessions</tspan></text>
  <text class="code"><tspan class="verb" x="770" y="278">GET</tspan><tspan x="836" y="278">/v1/sessions/{id}</tspan></text>
  <text class="code"><tspan class="verb" x="770" y="316">POST</tspan><tspan x="836" y="316">/v1/payment_links</tspan></text>
  <text class="code"><tspan class="verb" x="770" y="354">POST</tspan><tspan x="836" y="354">/v1/webhook_endpoints</tspan></text>
  <line x1="770" y1="378" x2="1110" y2="378" stroke="#e3e6ec"/>
  <text class="code muted" x="770" y="414">event  session.paid</text>
</svg>
