  <body aria-busy="true">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="rail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <a class="brand" href="#overview" aria-label="Prismaport API reference home">
        <svg class="mark" width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 10 L55 50 L9 50 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
          <path d="M3 36 L43 33 L61 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M43 33 L61 43" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <b>Prismaport</b><span>Developers</span>
      </a>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        <input id="q" type="search" placeholder="Search endpoints and events" aria-label="Search the API reference" autocomplete="off" />
        <kbd id="q-kbd">Ctrl K</kbd>
      </div>
      <div class="top-right">
        <div class="mode" role="group" aria-label="API mode">
          <button class="test" id="mode-test" type="button" aria-pressed="true">Test</button>
          <button id="mode-live" type="button" aria-pressed="false">Live</button>
        </div>
        <a class="btn" href="#webhooks">Webhooks</a>
        <a class="btn primary" href="/dashboard/developers/api-keys">API keys</a>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Dark theme" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" /></svg>
        </button>
      </div>
    </header>
    <div class="shell">
      <nav class="rail" id="rail" aria-label="API reference">
        <div class="rail-search"><input id="q-rail" type="search" placeholder="Search endpoints and events" aria-label="Search the API reference" autocomplete="off" /></div>
        <div id="rail-links"></div>
      </nav>
      <main><div class="page" id="page"></div></main>
    </div>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">The API reference needs JavaScript. The contract is also at <a href="openapi.json">openapi.json</a>.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
